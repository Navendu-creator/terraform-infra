apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wazuh-dev
  namespace: argocd
spec:
  project: wazuh

  source:
    repoURL: https://github.com/Navendu-creator/gitops-helm-apps.git
    targetRevision: main
    path: apps/wazuh
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: wazuh-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
