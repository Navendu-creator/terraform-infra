apiVersion: v1
kind: Service
metadata:
  name: wazuh-service
  labels:
    app: wazuh
spec:
  type: ClusterIP
  selector:
    app: wazuh
  ports:
    - name: http
      port: 80
      targetPort: 80
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wazuh-ingress
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wazuh-service
                port:
                  number: 80
{{- end }}
